<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="hidden">
      <div class="bars" id="bars"><i></i><i></i></div>
      <div class="vignette"></div>

      <div id="brand">
        <div class="logo">KT</div>
        <div>
          <h1 id="t-title"></h1>
          <p id="t-sub"></p>
        </div>
      </div>

      <section id="stage-select">
        <aside class="panel" id="list">
          <div id="slots"></div>
        </aside>
        <div id="world"></div>
        <section class="panel hidden" id="detail"></section>
      </section>

      <section id="stage-spawn" class="hidden">
        <div class="spawn-head">
          <h2 id="t-spawn"></h2>
          <p id="t-spawn-sub"></p>
        </div>
        <div id="spawns"></div>
      </section>

      <div id="dock">
        <div class="player panel" id="player"></div>
        <div class="fx panel" id="fx"></div>
      </div>

      <div id="modal" class="modal hidden">
        <div class="box" id="modal-box"></div>
      </div>
      <div id="toast" class="toast hidden"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
